<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName review.vuln.freearchive.org

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/review.vuln.freearchive.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/review.vuln.freearchive.org/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # Overwrite, rather than append to, any client-supplied forwarding header.
    RequestHeader set X-Forwarded-For expr=%{REMOTE_ADDR}
    ProxyPass        / http://10.205.22.135:8765/
    ProxyPassReverse / http://10.205.22.135:8765/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"

    ErrorLog ${APACHE_LOG_DIR}/vulnarchive-review-error.log
    CustomLog ${APACHE_LOG_DIR}/vulnarchive-review-access.log combined
</VirtualHost>
</IfModule>
