<VirtualHost *:80>
    ServerName vuln.freearchive.org
    Redirect permanent / https://vuln.freearchive.org/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName vuln.freearchive.org

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/vuln.freearchive.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/vuln.freearchive.org/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Stable public copies of archived mailing-list posts.
    ProxyPass        /archive/ http://127.0.0.1:8765/archive/
    ProxyPassReverse /archive/ http://127.0.0.1:8765/archive/

    # The archive service builds this bounded-memory dump from the canonical
    # BCP-03 publication feed.
    ProxyPass        /dumps/gna-1988.ndjson http://127.0.0.1:8765/dumps/gna-1988.ndjson
    ProxyPassReverse /dumps/gna-1988.ndjson http://127.0.0.1:8765/dumps/gna-1988.ndjson

    # Vulnerability-Lookup is the canonical public application and provides
    # /api/gcve/publication and /.well-known/api-policy.json.
    ProxyPass        / http://127.0.0.1:10001/
    ProxyPassReverse / http://127.0.0.1:10001/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/vulnarchive-error.log
    CustomLog ${APACHE_LOG_DIR}/vulnarchive-access.log combined
</VirtualHost>
</IfModule>
