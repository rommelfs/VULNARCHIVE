<VirtualHost *:80>
    ServerName vuln.freearchive.org
    Redirect permanent / https://vuln.freearchive.org/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName vuln.freearchive.org

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/vuln.freearchive.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/vuln.freearchive.org/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Explicit public allowlist. The review UI (127.0.0.1:8765), connection
    # controls, and all publication/write endpoints are deliberately unproxied.
    ProxyPass        /api/gcve/publication http://127.0.0.1:8766/api/gcve/publication
    ProxyPassReverse /api/gcve/publication http://127.0.0.1:8766/api/gcve/publication
    ProxyPass        /dumps/gna-1988.ndjson http://127.0.0.1:8766/dumps/gna-1988.ndjson
    ProxyPassReverse /dumps/gna-1988.ndjson http://127.0.0.1:8766/dumps/gna-1988.ndjson
    ProxyPass        /.well-known/security.txt http://127.0.0.1:8766/.well-known/security.txt
    ProxyPassReverse /.well-known/security.txt http://127.0.0.1:8766/.well-known/security.txt
    ProxyPass        /archive/ http://127.0.0.1:8766/archive/
    ProxyPassReverse /archive/ http://127.0.0.1:8766/archive/
    ProxyPassMatch   "^/$" http://127.0.0.1:8766/
    ProxyPassReverse / http://127.0.0.1:8766/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/vulnarchive-error.log
    CustomLog ${APACHE_LOG_DIR}/vulnarchive-access.log combined
</VirtualHost>
</IfModule>
