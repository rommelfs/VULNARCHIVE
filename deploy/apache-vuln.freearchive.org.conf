<VirtualHost *:80>
    ServerName vuln.freearchive.org
    Redirect permanent / https://vuln.freearchive.org/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName vuln.freearchive.org

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/vuln.freearchive.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/vuln.freearchive.org/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # The review backend performs authentication and the client-IP allowlist.
    # Overwrite client-supplied forwarding data before proxying the private path.
    RequestHeader set X-Forwarded-For expr=%{REMOTE_ADDR}

    # Explicit public allowlist. The private review UI (10.205.22.135:8765), connection
    # controls, and all publication/write endpoints are deliberately unproxied.
    ProxyPass        /api/gcve/publication http://127.0.0.1:8766/api/gcve/publication
    ProxyPassReverse /api/gcve/publication http://127.0.0.1:8766/api/gcve/publication
    ProxyPass        /dumps/gna-1988.ndjson http://127.0.0.1:8766/dumps/gna-1988.ndjson
    ProxyPassReverse /dumps/gna-1988.ndjson http://127.0.0.1:8766/dumps/gna-1988.ndjson
    RedirectMatch 302 ^/review$ /review/
    ProxyPass        /review/ http://10.205.22.135:8765/
    ProxyPassReverse /review/ http://10.205.22.135:8765/
    ProxyPass "/.well-known/security.txt" "!"
    Alias "/.well-known/security.txt" "/opt/vulnarchive/deploy/security.txt"
    <Location "/.well-known/security.txt">
        Header always set Content-Type "text/plain; charset=utf-8"
    </Location>
    ProxyPass        /archive/ http://127.0.0.1:8766/archive/
    ProxyPassReverse /archive/ http://127.0.0.1:8766/archive/
    ProxyPass        /vulnerability/ http://127.0.0.1:8766/vulnerability/
    ProxyPassReverse /vulnerability/ http://127.0.0.1:8766/vulnerability/
    ProxyPassMatch   "^/$" http://127.0.0.1:8766/
    ProxyPassReverse / http://127.0.0.1:8766/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/vulnarchive-error.log
    CustomLog ${APACHE_LOG_DIR}/vulnarchive-access.log combined
</VirtualHost>
</IfModule>
