<VirtualHost *:80>
    ServerName vuln.freearchive.org
    Redirect permanent / https://vuln.freearchive.org/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName vuln.freearchive.org

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/vuln.freearchive.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/vuln.freearchive.org/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # GCVE discovery metadata is maintained with this deployment rather than
    # delegated to the upstream application.
    ProxyPass "/.well-known/security.txt" "!"
    Alias "/.well-known/security.txt" "/opt/vulnarchive/deploy/security.txt"
    <Location "/.well-known/security.txt">
        Header always set Content-Type "text/plain; charset=utf-8"
    </Location>
    <Directory "/opt/vulnarchive/deploy">
        Require all granted
    </Directory>

    # Stable public copies of archived mailing-list posts.
    ProxyPass        /archive/ http://127.0.0.1:8765/archive/
    ProxyPassReverse /archive/ http://127.0.0.1:8765/archive/

    # Vulnerability-Lookup is the canonical public application and provides
    # /api/gcve/publication, /.well-known/api-policy.json and /dumps/.
    ProxyPass        / http://127.0.0.1:10001/
    ProxyPassReverse / http://127.0.0.1:10001/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/vulnarchive-error.log
    CustomLog ${APACHE_LOG_DIR}/vulnarchive-access.log combined
</VirtualHost>
</IfModule>
